[tool.poetry]
name = "langgraph-supervisor-multiagent"
version = "0.1.0"
description = "This project implements a multi-agent system using LangGraph, designed to coordinate and supervise multiple agents for complex task execution. The system is modular, extensible, and leverages a graph-based approach to manage agent interactions and workflows."
authors = ["hammad.yaqoob1985@yahoo.co.uk"]
readme = "README.md"
packages = [
    { include = "app" },
]


[tool.poetry.dependencies]
python = ">=3.11,<4.0"
uvicorn = "0.35.0"
langchain = "0.3.26"
langchain-anthropic = "0.3.15"
langchain-aws = "0.2.27"
langchain-community = "0.3.26"
langchain-core = "0.3.68"
langchain-experimental = "0.3.4"
langchain-openai = "0.3.22"
langchain-text-splitters = "0.3.8"
langgraph = "0.4.8"
langgraph-checkpoint = "2.0.26"
langgraph-prebuilt = "0.2.2"
langgraph-sdk = "0.1.70"
langsmith = "0.3.45"
boto3 = "1.39.3"
botocore = "1.39.3"
annotated-types= "0.7.0"
anthropic= "0.54.0"
faiss-cpu = "1.11.0"
fastapi = "0.115.14"
pandas = "2.3.0"
pydantic= "2.11.5"
pydantic-settings = "2.10.0"
pydantic_core = "2.33.2"
pyparsing = "3.2.3"
python-dateutil = "2.9.0.post0"
python-dotenv = "1.1.0"

[tool.poetry.group.dev.dependencies]
langchain-cli = ">=0.0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
